[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.description }}"
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
dependencies = [
    "django",
    "django-environ",
    "django-tailwind-cli",
    "django-widget-tweaks",
    "gunicorn",
    "whitenoise[brotli]",
{%- if cookiecutter.use_users_app == 'yes' %}
    "django-allauth",
    "pillow",
{%- endif %}
{%- if cookiecutter.database_type == 'postgres' %}
    "psycopg2-binary",
{%- endif %}
{%- if cookiecutter.use_celery == 'yes' %}
    "celery[redis]",
{%- endif %}
{%- if cookiecutter.use_htmx == 'yes' %}
    "django-htmx",
{%- endif %}
]